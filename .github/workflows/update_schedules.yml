name: Schedule Update

on:
  workflow_dispatch: # Allows you to manually trigger the run from the Actions tab

permissions:
  contents: write # Required to push commits back to the repo

jobs:
  update-schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dateutil pytz

      - name: Run update pipeline
        run: python run_all.py --update

      - name: Commit and push updated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.json output/*.json html/*.html
          git commit -m "Auto-update sports schedules" || echo "No changes to commit"
          git push
