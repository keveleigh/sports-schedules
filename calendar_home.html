<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'listYear',
          events: [{"title": "Texas Rangers @ Seattle Mariners", "start": "2026-04-18T23:15:00+00:00", "color": "cadetblue", "extendedProps": {"location": "T-Mobile Park", "league": "MLB"}}, {"title": "St. Louis CITY SC @ Seattle Sounders FC", "start": "2026-04-19T01:30:00+00:00", "color": "green", "extendedProps": {"location": "Lumen Field", "league": "MLS"}}, {"title": "San Diego Padres @ Seattle Mariners", "start": "2026-05-16T23:15:00+00:00", "color": "cadetblue", "extendedProps": {"location": "T-Mobile Park", "league": "MLB"}}, {"title": "LA Galaxy @ Seattle Sounders FC", "start": "2026-05-17T01:00:00+00:00", "color": "green", "extendedProps": {"location": "Lumen Field", "league": "MLS"}}, {"title": "Red Bull New York @ Seattle Sounders FC", "start": "2026-09-06T00:30:00+00:00", "color": "green", "extendedProps": {"location": "Lumen Field", "league": "MLS"}}, {"title": "Athletics @ Seattle Mariners", "start": "2026-09-06T01:40:00+00:00", "color": "cadetblue", "extendedProps": {"location": "T-Mobile Park", "league": "MLB"}}, {"title": "Real Salt Lake @ Seattle Sounders FC", "start": "2026-09-24T01:30:00+00:00", "color": "green", "extendedProps": {"location": "Lumen Field", "league": "MLS"}}, {"title": "Houston Astros @ Seattle Mariners", "start": "2026-09-24T02:10:00+00:00", "color": "cadetblue", "extendedProps": {"location": "T-Mobile Park", "league": "MLB"}}, {"title": "Minnesota United FC @ Seattle Sounders FC", "start": "2026-09-27T00:30:00+00:00", "color": "green", "extendedProps": {"location": "Lumen Field", "league": "MLS"}}, {"title": "Los Angeles Angels @ Seattle Mariners", "start": "2026-09-27T01:40:00+00:00", "color": "cadetblue", "extendedProps": {"location": "T-Mobile Park", "league": "MLB"}}],
          eventContent: function(arg) {
            let html = '<b>' + arg.event.title + '</b><br>';
            html += '<i>' + arg.event.extendedProps.league + ' - ' + arg.event.extendedProps.location + '</i><br>';
            return { html: html };
          }
        });
        calendar.render();
      });
    </script>
    <style>
      body { margin: 40px 10px; padding: 0; font-family: Arial, Helvetica Neue, Helvetica, sans-serif; font-size: 14px; background-color: #f8f9fa; }
      #calendar { max-width: 900px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
      .fc-list-event-title { white-space: normal !important; }
    </style>
</head>
<body>
    <h2 class="text-center mb-4">Home Schedule Overlaps</h2>
    <div id='calendar'></div>
</body>
</html>
